# push 到指定分支后自动构建 Tauri 安装包并发布到 GitHub Release。
# 每次发布使用「时间戳」作为 tag / 发布名，避免与 package 版本号冲突、且按时间唯一排序。
name: Build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-tag:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.TAG }}
      changelog: ${{ steps.changelog.outputs.CHANGELOG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成按时间的 release 标签（UTC）
        id: tag
        run: |
          TAG="release-$(date -u +'%Y%m%d-%H%M%S')"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "本次发布标签: $TAG"

      - name: 生成上次发布以来的变更日志
        id: changelog
        run: |
          # 取最后一个 release tag，如果没有则从项目开始算
          LAST_TAG=$(git tag --list 'release-*' --sort=-creatordate | head -1 || true)
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
            echo "首个发布，无历史 tag"
          else
            RANGE="$LAST_TAG..HEAD"
            echo "对比范围: $RANGE"
          fi

          CHANGELOG=$(git log --oneline --no-decorate $RANGE 2>/dev/null || echo "（尚无提交记录）")

          # 转义换行符和多行文本，适配 GITHUB_OUTPUT
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"
          echo "CHANGELOG=$CHANGELOG" >> "$GITHUB_OUTPUT"

  publish:
    needs:
      - prepare-tag
    env:
      # Vite 打包 monaco/mermaid/shiki 等重型依赖时易触达 Node 默认 ~2GB 堆上限
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system dependencies (Tauri)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            libgtk-3-dev

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 可选：配置仓库 Secrets 后启用代码签名 / 更新器
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          tagName: ${{ needs.prepare-tag.outputs.tag_name }}
          releaseName: ${{ needs.prepare-tag.outputs.tag_name }}
          releaseBody: |
            ${{ needs.prepare-tag.outputs.changelog }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
