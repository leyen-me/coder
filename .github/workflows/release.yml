# 推送 main 后自动构建全平台二进制并发布到 npm。
# 发布策略：主包 @alanwchat/coder + 各平台 optional 包。
#
# 首次使用前需要在仓库设置中添加 Secrets:
#   NPM_TOKEN — npm automation token（publish 权限）
#
name: Release to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提取版本号
        id: version
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次发布版本: $VERSION"

  build:
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            npm_platform: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            npm_platform: darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            npm_platform: linux-x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm_platform: win32-x64

    runs-on: ${{ matrix.os }}
    env:
      BINARY_NAME: coder${{ startsWith(matrix.target, 'x86_64-pc-windows') && '.exe' || '' }}

    steps:
      - uses: actions/checkout@v4

      # ---- Frontend build (needed for rust-embed) ----
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build:frontend

      # ---- Rust build ----
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build release binary
        working-directory: backend
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (macOS / Linux)
        if: matrix.os != 'windows-latest'
        run: strip backend/target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p npm-packages/${{ matrix.npm_platform }}
          cp backend/target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} \
             npm-packages/${{ matrix.npm_platform }}/${{ env.BINARY_NAME }}

      # ---- Generate platform-specific package.json ----
      - name: Generate platform npm package
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PLATFORM="${{ matrix.npm_platform }}"

          cat > npm-packages/$PLATFORM/package.json <<EOF
          {
            "name": "@alanwchat/coder-$PLATFORM",
            "version": "$VERSION",
            "description": "Coder binary for $PLATFORM",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/${{ github.repository }}.git"
            },
            "os": ["$(echo $PLATFORM | cut -d- -f1)"],
            "cpu": ["$(echo $PLATFORM | cut -d- -f2)"]
          }
          EOF

      - name: Publish platform package to npm
        working-directory: npm-packages/${{ matrix.npm_platform }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public

  publish-main:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Generate and publish main package @alanwchat/coder
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          mkdir -p npm-main

          cat > npm-main/package.json <<EOF
          {
            "name": "@alanwchat/coder",
            "version": "$VERSION",
            "description": "Coder — AI-powered coding assistant",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/${{ github.repository }}.git"
            },
            "bin": {
              "coder": "cli.mjs"
            },
            "optionalDependencies": {
              "@alanwchat/coder-darwin-arm64": "$VERSION",
              "@alanwchat/coder-darwin-x64": "$VERSION",
              "@alanwchat/coder-linux-x64": "$VERSION",
              "@alanwchat/coder-win32-x64": "$VERSION"
            }
          }
          EOF

          cp npm/cli.mjs npm-main/cli.mjs
          chmod +x npm-main/cli.mjs

          cd npm-main
          npm publish --access public

      - name: 创建 GitHub Release（记录版本）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          body: |
            v${{ needs.prepare.outputs.version }} 发布到 npm

            ```
            npm i -g @alanwchat/coder
            coder --help
            ```
          draft: false
          prerelease: false
