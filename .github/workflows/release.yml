# 推送 main 后自动构建全平台二进制并发布到 npm。
# 发布策略：主包 @leyen/coder + 各平台 optional 包。
#
# 首次使用前需要在仓库设置中添加 Secrets:
#   NPM_TOKEN — npm automation token（publish 权限）
#
name: Release to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提取版本号
        id: version
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次发布版本: $VERSION"

  build:
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            npm_platform: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            npm_platform: darwin-x64
          - target: x86_64-unknown-linux-gnu
            # Pin to 22.04 (glibc 2.35) so binaries run on Ubuntu 22.04+; ubuntu-latest drifts to newer glibc.
            os: ubuntu-22.04
            npm_platform: linux-x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            npm_platform: win32-x64

    runs-on: ${{ matrix.os }}
    env:
      BINARY_NAME: coder${{ startsWith(matrix.target, 'x86_64-pc-windows') && '.exe' || '' }}

    steps:
      - uses: actions/checkout@v4

      # ---- Frontend build (needed for rust-embed) ----
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build:frontend

      # ---- Rust build ----
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Build release binary
        working-directory: backend
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (macOS / Linux)
        if: matrix.os != 'windows-latest'
        run: strip backend/target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p npm-packages/${{ matrix.npm_platform }}
          cp backend/target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} \
             npm-packages/${{ matrix.npm_platform }}/${{ env.BINARY_NAME }}

      - name: Verify Linux glibc compatibility
        if: matrix.npm_platform == 'linux-x64'
        shell: bash
        run: |
          BIN="npm-packages/linux-x64/${{ env.BINARY_NAME }}"
          MAX_GLIBC=$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1)
          ALLOWED="2.35"
          echo "Max required GLIBC: ${MAX_GLIBC:-unknown} (allowed: <= $ALLOWED)"
          if [ -z "$MAX_GLIBC" ] || [ "$(printf '%s\n' "$MAX_GLIBC" "$ALLOWED" | sort -V | head -1)" != "$MAX_GLIBC" ]; then
            echo "Error: binary requires GLIBC up to ${MAX_GLIBC:-unknown}; max allowed is $ALLOWED (Ubuntu 22.04 baseline)."
            exit 1
          fi

      # ---- Generate platform-specific package.json ----
      - name: Generate platform npm package
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PLATFORM="${{ matrix.npm_platform }}"

          # Determine binary name: .exe on Windows, no extension on Unix
          case "$PLATFORM" in
            win32-*) BIN_NAME="coder.exe" ;;
            *)       BIN_NAME="coder" ;;
          esac
          cat > npm-packages/$PLATFORM/package.json <<EOF
          {
            "name": "@leyen/coder-$PLATFORM",
            "version": "$VERSION",
            "description": "Coder binary for $PLATFORM",
            "main": "$BIN_NAME",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/${{ github.repository }}.git"
            },
            "os": ["$(echo $PLATFORM | cut -d- -f1)"],
            "cpu": ["$(echo $PLATFORM | cut -d- -f2)"]
          }
          EOF

          case "$PLATFORM" in
            darwin-arm64) PLATFORM_LABEL="macOS (Apple Silicon)" ;;
            darwin-x64)   PLATFORM_LABEL="macOS (Intel)" ;;
            linux-x64)    PLATFORM_LABEL="Linux (x64)" ;;
            win32-x64)    PLATFORM_LABEL="Windows (x64)" ;;
          esac
          sed -e "s/{{PLATFORM}}/$PLATFORM/g" -e "s/{{PLATFORM_LABEL}}/$PLATFORM_LABEL/g" \
            npm/README.platform.md > npm-packages/$PLATFORM/README.md

      - name: Publish platform package to npm
        shell: bash
        working-directory: npm-packages/${{ matrix.npm_platform }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
          npm publish --access public

  publish-main:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Generate and publish main package @leyen/coder
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          mkdir -p npm-main

          cat > npm-main/package.json <<EOF
          {
            "name": "@leyen/coder",
            "version": "$VERSION",
            "description": "Coder — AI-powered coding assistant",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/${{ github.repository }}.git"
            },
            "bin": {
              "coder": "cli.mjs"
            },
            "optionalDependencies": {
              "@leyen/coder-darwin-arm64": "$VERSION",
              "@leyen/coder-darwin-x64": "$VERSION",
              "@leyen/coder-linux-x64": "$VERSION",
              "@leyen/coder-win32-x64": "$VERSION"
            }
          }
          EOF

          cp npm/cli.mjs npm-main/cli.mjs
          cp npm/README.md npm-main/README.md
          chmod +x npm-main/cli.mjs

          cd npm-main
          npm config set "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
          npm publish --access public

      - name: 创建 GitHub Release（记录版本）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          body: |
            v${{ needs.prepare.outputs.version }} 发布到 npm

            ```
            npm i -g @leyen/coder
            coder --help
            ```
          draft: false
          prerelease: false
