# 推送 main 后发布统一版本：
#   1) npm：@leyen/coder + 各平台 optional 二进制包
#   2) GitHub Release：同一 tag 挂上 macOS .dmg / Windows .exe
#
# Secrets:
#   NPM_TOKEN — npm automation token（publish 权限）
#
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.VERSION }}
      tag_name: ${{ steps.meta.outputs.TAG }}
      changelog: ${{ steps.changelog.outputs.CHANGELOG }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 生成版本与标签
        id: meta
        run: |
          VERSION="0.1.${{ github.run_number }}"
          TAG="v${VERSION}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "本次发布: $TAG"

      - name: 生成变更日志
        id: changelog
        run: |
          LAST_TAG=$(git tag --list 'v0.1.*' --sort=-creatordate | head -1 || true)
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
            echo "首个发布，无历史 tag"
          else
            RANGE="$LAST_TAG..HEAD"
            echo "对比范围: $RANGE"
          fi

          CHANGELOG=$(git log --oneline --no-decorate $RANGE 2>/dev/null || echo "（尚无提交记录）")

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "CHANGELOG<<$EOF"
            echo "$CHANGELOG"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

  build-cli:
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            build_target: aarch64-apple-darwin
            artifact_target: aarch64-apple-darwin
            use_zigbuild: false
            os: macos-latest
            npm_platform: darwin-arm64
          - target: x86_64-apple-darwin
            build_target: x86_64-apple-darwin
            artifact_target: x86_64-apple-darwin
            use_zigbuild: false
            os: macos-latest
            npm_platform: darwin-x64
          - target: x86_64-unknown-linux-gnu
            # Build with Zig against glibc 2.35 so Linux binaries run on Ubuntu 22.04+
            # without depending on the runner image's host glibc or broken vendored OpenSSL linkage.
            build_target: x86_64-unknown-linux-gnu.2.35
            artifact_target: x86_64-unknown-linux-gnu
            use_zigbuild: true
            os: ubuntu-latest
            npm_platform: linux-x64
          - target: x86_64-pc-windows-msvc
            build_target: x86_64-pc-windows-msvc
            artifact_target: x86_64-pc-windows-msvc
            use_zigbuild: false
            os: windows-latest
            npm_platform: win32-x64

    runs-on: ${{ matrix.os }}
    env:
      BINARY_NAME: coder${{ startsWith(matrix.target, 'x86_64-pc-windows') && '.exe' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build:frontend

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        if: matrix.use_zigbuild
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Write version to backend manifest
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "Setting CLI version to $VERSION"

          node -e '
            const fs = require("fs");
            const path = "backend/Cargo.toml";
            const version = process.argv[1];
            const source = fs.readFileSync(path, "utf8");
            const updated = source.replace(
              /^version = ".*"$/m,
              `version = "${version}"`
            );
            if (updated === source) {
              throw new Error("Failed to update backend/Cargo.toml version");
            }
            fs.writeFileSync(path, updated);
          ' "$VERSION"

      - name: Build release binary (native)
        if: ${{ !matrix.use_zigbuild }}
        working-directory: backend
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release binary (zigbuild)
        if: matrix.use_zigbuild
        working-directory: backend
        shell: bash
        run: cargo zigbuild --release --target ${{ matrix.build_target }}

      - name: Strip binary (macOS / Linux)
        if: matrix.os != 'windows-latest'
        run: strip backend/target/${{ matrix.artifact_target }}/release/${{ env.BINARY_NAME }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p npm-packages/${{ matrix.npm_platform }}
          cp backend/target/${{ matrix.artifact_target }}/release/${{ env.BINARY_NAME }} \
             npm-packages/${{ matrix.npm_platform }}/${{ env.BINARY_NAME }}

      - name: Verify Linux glibc compatibility
        if: matrix.npm_platform == 'linux-x64'
        shell: bash
        run: |
          BIN="npm-packages/linux-x64/${{ env.BINARY_NAME }}"
          MAX_GLIBC=$(objdump -T "$BIN" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1)
          ALLOWED="2.35"
          echo "Max required GLIBC: ${MAX_GLIBC:-unknown} (allowed: <= $ALLOWED)"
          if [ -z "$MAX_GLIBC" ] || [ "$(printf '%s\n' "$MAX_GLIBC" "$ALLOWED" | sort -V | head -1)" != "$MAX_GLIBC" ]; then
            echo "Error: binary requires GLIBC up to ${MAX_GLIBC:-unknown}; max allowed is $ALLOWED (Ubuntu 22.04 baseline)."
            exit 1
          fi

      - name: Generate platform npm package
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PLATFORM="${{ matrix.npm_platform }}"

          case "$PLATFORM" in
            win32-*) BIN_NAME="coder.exe" ;;
            *)       BIN_NAME="coder" ;;
          esac
          cat > npm-packages/$PLATFORM/package.json <<EOF
          {
            "name": "@leyen/coder-$PLATFORM",
            "version": "$VERSION",
            "description": "Coder binary for $PLATFORM",
            "main": "$BIN_NAME",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/${{ github.repository }}.git"
            },
            "os": ["$(echo $PLATFORM | cut -d- -f1)"],
            "cpu": ["$(echo $PLATFORM | cut -d- -f2)"]
          }
          EOF

          case "$PLATFORM" in
            darwin-arm64) PLATFORM_LABEL="macOS (Apple Silicon)" ;;
            darwin-x64)   PLATFORM_LABEL="macOS (Intel)" ;;
            linux-x64)    PLATFORM_LABEL="Linux (x64)" ;;
            win32-x64)    PLATFORM_LABEL="Windows (x64)" ;;
          esac
          sed -e "s/{{PLATFORM}}/$PLATFORM/g" -e "s/{{PLATFORM_LABEL}}/$PLATFORM_LABEL/g" \
            npm/README.platform.md > npm-packages/$PLATFORM/README.md

      - name: Publish platform package to npm
        shell: bash
        working-directory: npm-packages/${{ matrix.npm_platform }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
          npm publish --access public

  build-desktop:
    needs:
      - prepare
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundle: dmg
            artifact_glob: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - platform: windows-latest
            bundle: nsis
            artifact_glob: desktop/src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install desktop CLI dependencies
        run: pnpm --dir desktop install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            backend
            desktop/src-tauri

      - name: Write version to desktop manifests
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "Setting app version to $VERSION"

          jq ".version = \"$VERSION\"" desktop/src-tauri/tauri.conf.json > tmp.json \
            && mv tmp.json desktop/src-tauri/tauri.conf.json

          jq ".version = \"$VERSION\"" desktop/package.json > tmp.json \
            && mv tmp.json desktop/package.json

          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" backend/Cargo.toml \
            && rm -f backend/Cargo.toml.bak

      # Use tauri-action for the build (same path that produced desktop-v0.1.1).
      # Omit tagName so it only builds; the unified Release is created later.
      - name: Build desktop installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/src-tauri
          args: --bundles ${{ matrix.bundle }}

      - name: Upload desktop installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.bundle }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  publish:
    needs:
      - prepare
      - build-cli
      - build-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Generate and publish main package @leyen/coder
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          mkdir -p npm-main

          cat > npm-main/package.json <<EOF
          {
            "name": "@leyen/coder",
            "version": "$VERSION",
            "description": "Coder — AI-powered coding assistant",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/${{ github.repository }}.git"
            },
            "bin": {
              "coder": "cli.mjs"
            },
            "optionalDependencies": {
              "@leyen/coder-darwin-arm64": "$VERSION",
              "@leyen/coder-darwin-x64": "$VERSION",
              "@leyen/coder-linux-x64": "$VERSION",
              "@leyen/coder-win32-x64": "$VERSION"
            }
          }
          EOF

          cp npm/cli.mjs npm-main/cli.mjs
          cp npm/README.md npm-main/README.md
          chmod +x npm-main/cli.mjs

          cd npm-main
          npm config set "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
          npm publish --access public

      - name: Download desktop installers
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: desktop-dist
          merge-multiple: true

      - name: List release assets
        run: ls -la desktop-dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.tag_name }}
          body: |
            ## Install

            **CLI (npm)**
            ```bash
            npm i -g @leyen/coder
            coder --help
            ```

            **Desktop**
            - macOS: download the `.dmg` below
            - Windows: download the `.exe` installer below

            ## Changelog

            ${{ needs.prepare.outputs.changelog }}
          files: |
            desktop-dist/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
