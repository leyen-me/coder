[package]
name = "coder-desktop"
version = "0.1.0"
description = "Coder desktop shell (Tauri)"
authors = ["you"]
edition = "2021"

[lib]
name = "coder_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
coder_lib = { path = "../../backend", package = "coder" }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
url = "2"
